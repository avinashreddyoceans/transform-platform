# ── Integration (E2E) test profile ────────────────────────────────────────────
# Applied on top of application.yml when @ActiveProfiles("integration-test") is set.
# Testcontainers overrides datasource + MinIO properties via @DynamicPropertySource.
#
# Schema management: Testcontainers starts a fresh PostgreSQL container for each
# test run and initialises it using the init scripts mounted at
# /docker-entrypoint-initdb.d/ via @DynamicPropertySource or the JDBC URL
# TC_INITSCRIPT parameter. No Flyway needed — the container is always clean.

spring:
  # Disable Kafka auto-configuration — not relevant to integration-service E2E tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  jpa:
    hibernate:
      # Schema is created by the Testcontainers init script (db/schema.sql in
      # src/integrationTest/resources — uses IF NOT EXISTS so it is idempotent
      # when withReuse(true) containers are reused across test runs).
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

transform-platform:
  security:
    # Fixed test key — 64 hex chars = 256-bit key, satisfies Spring Security crypto
    credential-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    jwt-secret: "test-jwt-secret-which-is-long-enough-for-hs256-algorithm-minimum"
    jwt-expiry-hours: 1

# ── Camel ──────────────────────────────────────────────────────────────────────
# DynamicRouteManager is @MockkBean in tests, so Camel won't try to register
# real SFTP/S3 routes. We still disable auto-startup as a safety net.
camel:
  springboot:
    auto-startup: false
    main-run-controller: false

logging:
  level:
    com.transformplatform: DEBUG
    org.testcontainers: INFO

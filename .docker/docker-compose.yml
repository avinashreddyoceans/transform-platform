version: '3.9'

# Local infrastructure for transform-platform development.
#
# ── Profiles ──────────────────────────────────────────────────────────────────
# Three profiles let you compose only what you need:
#
#   core          — Postgres · pgAdmin · Kafka · Zookeeper · Kafka UI · MinIO
#                   ~1.5 GB total.  Use this for day-to-day development.
#
#   observability — OTel Collector · Jaeger · Prometheus · Grafana
#                   · Elasticsearch · Kibana
#                   +~2 GB on top of core.  Start only when debugging
#                   traces / metrics / logs.
#
#   sftp          — Custom SFTP server (atmoz/sftp + inotify watcher)
#                   inbox / outbox / sent folder semantics, ~128 MB.
#                   Connect with FileZilla: localhost:2222  sftpuser/sftppass
#
# Usage:
#   Core only (fast, lean):
#     docker compose -f .docker/docker-compose.yml --profile core up -d
#
#   Core + SFTP (for CAMT.053 end-to-end demo):
#     docker compose -f .docker/docker-compose.yml --profile core --profile sftp up -d
#
#   Full stack (all services):
#     docker compose -f .docker/docker-compose.yml --profile core --profile observability --profile sftp up -d
#
#   Stop everything and remove volumes (fresh DB):
#     docker compose -f .docker/docker-compose.yml --profile core --profile observability --profile sftp down -v
#
# ── Ports ─────────────────────────────────────────────────────────────────────
#   Postgres       → 5432
#   pgAdmin        → 5050  (admin@transform.local / admin)
#   Kafka          → 9092  |  Kafka UI  → 8090
#   MinIO          → 9000 (API / SDK), 9001 (console UI)
#   SFTP           → 2222  (sftpuser / sftppass)
#   OTel Collector → 4317 (gRPC), 4318 (HTTP), 8889 (metrics)
#   Jaeger         → 16686 (UI)
#   Prometheus     → 9090
#   Grafana        → 3001  (admin / admin)
#   Elasticsearch  → 9200
#   Kibana         → 5601

services:

  # ── Data Layer ────────────────────────────────────────────────────────────
  # Budget: ~150 MB

  postgres:
    image: postgres:16-alpine
    container_name: transform-postgres
    profiles: [core]
    environment:
      POSTGRES_DB: transform_platform
      POSTGRES_USER: transform_user
      POSTGRES_PASSWORD: transform_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ── Schema bootstrap ────────────────────────────────────────────────────
      # Postgres runs every *.sql file in /docker-entrypoint-initdb.d/ on the
      # very first start (when the data volume is empty / container is recreated).
      # schema.sql is the single source of truth for the full database schema.
      # No migration versioning — just drop the volume and recreate to reset.
      - ../platform-api/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transform_user -d transform_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Budget: ~200 MB
  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: transform-pgadmin
    profiles: [core]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@transform.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"          # desktop mode — no login prompt
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro   # pre-register the Postgres server
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Messaging ─────────────────────────────────────────────────────────────
  # Budget: Zookeeper ~128 MB · Kafka ~320 MB · Kafka UI ~200 MB

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: transform-zookeeper
    profiles: [core]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Cap JVM heap — default is 512 MB which is far more than needed for local dev.
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx96m"
    mem_limit: 192m
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: transform-kafka
    profiles: [core]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      # Cap JVM heap — Confluent's default is 1 GB; 256 MB is plenty for local dev.
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: transform-kafka-ui
    profiles: [core]
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Limit Spring Boot heap inside kafka-ui
      JAVA_OPTS: "-Xms64m -Xmx128m"
    mem_limit: 256m
    restart: unless-stopped

  # ── Object Storage ────────────────────────────────────────────────────────
  # Budget: ~128 MB (Go binary, very lean)

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: transform-minio
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-compatible API (SDK / app)
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio_data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── SFTP Server ───────────────────────────────────────────────────────────
  # Start with: --profile sftp
  # Budget: ~128 MB
  #
  # Custom image built from .docker/sftp/Dockerfile (atmoz/sftp + inotify-tools).
  # An inotify watcher moves files from outbox/ → sent/ the moment the platform
  # finishes downloading them (close_nowrite event = FD closed after read-only open).
  #
  # Folder layout under /upload:
  #   inbox/   — platform writes here; FileZilla / client downloads from here
  #   outbox/  — FileZilla / client uploads here; Camel polls every 15 s
  #   sent/    — audit archive; watcher moves downloaded outbox files here
  #
  # FileZilla connection:
  #   Protocol : SFTP – SSH File Transfer Protocol
  #   Host     : localhost   Port : 2222
  #   User     : sftpuser    Pass : sftppass   Remote : /upload
  #
  # Drop a test file into outbox (no FileZilla needed):
  #   docker cp camt053_sample_file.xml \
  #     transform-sftp:/home/sftpuser/upload/outbox/camt053_$(date +%Y%m%d_%H%M%S).xml
  #
  # Watch watcher events live:
  #   docker logs -f transform-sftp
  #
  # Full connection guide: .docker/sftp/SFTP-SETUP.md

  sftp:
    build:
      context: ./sftp
      dockerfile: Dockerfile
    image: transform-sftp:latest
    container_name: transform-sftp
    profiles: [sftp]
    ports:
      - "2222:22"
    command: ["sftpuser:sftppass:1001"]
    volumes:
      - sftp_data:/home/sftpuser/upload
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/sftp-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Observability Stack ───────────────────────────────────────────────────
  # Start with: --profile observability
  # Combined budget: ~2.0 GB  (Elasticsearch is the dominant consumer)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: transform-otel-collector
    profiles: [observability]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (available but not used by the app)
      - "4318:4318"   # OTLP HTTP  (app sends traces + metrics + logs here)
      - "8889:8889"   # Prometheus metrics exporter (scraped by Prometheus)
      - "13133:13133" # Health check
    mem_limit: 128m
    depends_on:
      jaeger:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    # No healthcheck: distroless image — no shell/curl available.
    # Verify manually at http://localhost:13133/ if needed.

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: transform-jaeger
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      # Reduced from 50 000 — more than enough for local debugging sessions.
      MEMORY_MAX_TRACES: 10000
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC receiver (from OTel Collector)
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: transform-prometheus
    profiles: [observability]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 256m
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: transform-grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"   # 3000 is reserved for the Docusaurus dev server (website/)
    mem_limit: 256m
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: transform-elasticsearch
    profiles: [observability]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Reduced heap: 256 MB is enough for local log search.
      # ES also uses off-heap (Lucene file cache) — mem_limit gives it headroom.
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - cluster.name=transform-local
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: transform-kibana
    profiles: [observability]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      # Restrict Node.js heap inside Kibana
      NODE_OPTIONS: "--max-old-space-size=256"
    ports:
      - "5601:5601"
    mem_limit: 512m
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # One-shot container: waits for Kibana then creates the data view for logs.
  # Runs once on stack startup — safe to re-run (creation is idempotent).
  kibana-setup:
    image: curlimages/curl:8.6.0
    container_name: transform-kibana-setup
    profiles: [observability]
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c '
        echo "Creating Kibana data view: transform-platform-logs*";
        curl -sf -X POST http://kibana:5601/api/data_views/data_view \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d "{\"data_view\":{\"title\":\"transform-platform-logs*\",\"name\":\"Transform Platform Logs\",\"timeFieldName\":\"@timestamp\"}}" \
        && echo "Data view created successfully." \
        || echo "Data view may already exist — skipping.";
      '

  # ── AI Chatbot Service ────────────────────────────────────────────────────
  # LangGraph multi-agent chatbot for the Transform Platform UI.
  # Start with: --profile core  (depends on the core Spring Boot API)
  # Budget: ~256 MB (Python 3.12-slim + LangGraph + FastAPI)
  #
  # Required env vars (add to your .env):
  #   ANTHROPIC_API_KEY=sk-ant-...
  #
  # Listens on :8000.  Vite dev-server proxies /chatbot → :8000.

  chatbot:
    build:
      context: ../platform-chatbot
      dockerfile: Dockerfile
    container_name: transform-chatbot
    profiles: [core]
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TRANSFORM_API_URL: http://platform-api:8080
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      SESSION_TTL_MINUTES: "120"
    depends_on:
      - postgres
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
  sftp_data:
    name: transform-sftp-data
  prometheus_data:
  grafana_data:
  elasticsearch_data:

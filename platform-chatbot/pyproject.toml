[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-chatbot"
version = "0.1.0"
description = "LangGraph multi-agent chatbot service for Transform Platform"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain-anthropic>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
